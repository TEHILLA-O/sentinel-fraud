name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Sentinel.slnx
      - name: Format check
        run: dotnet format Sentinel.slnx --verify-no-changes --severity warn
        continue-on-error: true
      - name: Build
        run: dotnet build Sentinel.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Sentinel.slnx --no-build --configuration Release --verbosity normal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8088:8080"

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Ingestion/Sentinel.Ingestion.Api/Sentinel.Ingestion.Api.csproj
        DLL: Sentinel.Ingestion.Api.dll
    environment:
      ConnectionStrings__sentinel: Host=postgres;Port=5432;Database=sentinel;Username=sentinel;Password=sentinel
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__kafka: kafka:9092
      Kafka__BootstrapServers: kafka:9092
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  cases:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/CaseManagement/Sentinel.Cases.Api/Sentinel.Cases.Api.csproj
        DLL: Sentinel.Cases.Api.dll
    environment:
      ConnectionStrings__sentinel: Host=postgres;Port=5432;Database=sentinel;Username=sentinel;Password=sentinel
      ConnectionStrings__kafka: kafka:9092
      Kafka__BootstrapServers: kafka:9092
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Administration/Sentinel.Admin.Api/Sentinel.Admin.Api.csproj
        DLL: Sentinel.Admin.Api.dll
    environment:
      ConnectionStrings__sentinel: Host=postgres;Port=5432;Database=sentinel;Username=sentinel;Password=sentinel
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  transaction-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Workers/Sentinel.TransactionProcessor/Sentinel.TransactionProcessor.csproj
        DLL: Sentinel.TransactionProcessor.dll
    environment:
      ConnectionStrings__sentinel: Host=postgres;Port=5432;Database=sentinel;Username=sentinel;Password=sentinel
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__kafka: kafka:9092
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  profile-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Workers/Sentinel.ProfileProcessor/Sentinel.ProfileProcessor.csproj
        DLL: Sentinel.ProfileProcessor.dll
    environment:
      ConnectionStrings__sentinel: Host=postgres;Port=5432;Database=sentinel;Username=sentinel;Password=sentinel
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__kafka: kafka:9092
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  decision-publisher:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Workers/Sentinel.DecisionPublisher/Sentinel.DecisionPublisher.csproj
        DLL: Sentinel.DecisionPublisher.dll
    environment:
      ConnectionStrings__sentinel: Host=postgres;Port=5432;Database=sentinel;Username=sentinel;Password=sentinel
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__kafka: kafka:9092
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Web/Sentinel.Web/Sentinel.Web.csproj
        DLL: Sentinel.Web.dll
    environment:
      ConnectionStrings__sentinel: Host=postgres;Port=5432;Database=sentinel;Username=sentinel;Password=sentinel
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__kafka: kafka:9092
      Kafka__BootstrapServers: kafka:9092
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
